# version: "3.9"

services:

  leapvo:
    image: leapvo:latest
    container_name: leapvo
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
    shm_size: "8g"
    volumes:
      - ./leapvo:/workspace/leapvo
      - ./datasets:/workspace/data:ro
      - ./results/leapvo:/workspace/leapvo/results

  dytanvo:
    build: ./dytanvo
    container_name: dytanvo
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
    shm_size: "8g"
    volumes:
      - ./dytanvo:/workspace/DytanVO
      - ./datasets:/workspace/data:ro
      - ./results/dytanvo:/workspace/DytanVO/results

  coprou:
    build: ./coprou
    container_name: coprou
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
    shm_size: "8g"
    volumes:
      - ./coprou:/workspace/CoProU
      - ./datasets:/workspace/data:ro
      - ./results/coprou:/workspace/CoProU/results